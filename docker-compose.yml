version: '3.8'

networks:
  datamart-net:
    driver: bridge

volumes:
  pgdata:

services:
  hadoop:
    build:
      context: ./hadoop
    container_name: datamart-hadoop
    networks:
      - datamart-net
    volumes:
      - ./:/data/input:ro
      - ./mapreduce:/app/mapreduce
    environment:
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - HADOOP_HOME=/opt/hadoop

  db:
    image: postgres:15-alpine
    container_name: datamart-db
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - datamart-net
    ports:
      - "5432:5432"

  api:
    build:
      context: ./api
    container_name: datamart-api
    ports:
      - "${API_PORT}:8000"
    env_file:
      - .env
    volumes:
      - ./mapreduce:/app/mapreduce
      - ./scripts:/app/scripts
    networks:
      - datamart-net
    depends_on:
      - db
